services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contador
      POSTGRES_PASSWORD: contador_dev
      POSTGRES_DB: pergunteaosecontador
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contador -d pergunteaosecontador"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
